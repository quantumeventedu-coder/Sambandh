<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sambandh — Partner Management</title>
<style>
  :root { --bg:#1a1013; --card:#241519; --card2:#160c0f; --line:#3a2530; --ink:#f3e7ec; --mut:#b393a3; --pink:#c14d78; --forest:#2e7d46; --haldi:#b8860b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:20px 16px 70px; }
  h1 { font-family:Georgia,serif; font-size:24px; margin:0 0 2px; }
  h2 { font-family:Georgia,serif; font-size:18px; margin:20px 0 8px; }
  .sub { color:var(--mut); margin:0 0 16px; }
  input, select, textarea, button { font:inherit; }
  input, select, textarea { width:100%; background:var(--card2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:9px 11px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--pink); }
  button { background:var(--pink); border:1px solid var(--pink); color:#fff; border-radius:9px; padding:9px 14px; font-weight:600; cursor:pointer; width:auto; }
  button.ghost { background:transparent; color:var(--ink); }
  button.g { background:var(--forest); border-color:var(--forest); }
  button.danger { background:transparent; border-color:var(--pink); color:#e79bb6; }
  button.mini { padding:5px 10px; font-size:12px; }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  @media (max-width:640px){ .grid2,.grid3{ grid-template-columns:1fr; } }
  .field { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  .field label { font-size:12px; color:var(--mut); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .between { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .pill { font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; display:inline-block; }
  .pill.g { background:rgba(46,125,70,.2); color:#7fe0a2; }
  .pill.h { background:rgba(184,134,11,.2); color:#e8c46a; }
  .pill.r { background:rgba(193,77,120,.2); color:#e79bb6; }
  .hint { color:var(--mut); font-size:12.5px; }
  a { color:var(--pink); cursor:pointer; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#000; color:#fff; padding:10px 16px; border-radius:10px; display:none; z-index:9; }
</style>
</head>
<body>
<div class="wrap">
  <h1>sambandh · partner management</h1>
  <p class="sub">Staff console — onboard &amp; authenticate businesses (shops, photographers, astrologers, coaches). Employees sign in with their own account.</p>

  <!-- Sign in -->
  <div id="signin" class="card" style="max-width:440px">
    <div class="row" style="gap:6px;margin-bottom:10px">
      <button id="m-staff" class="mini" onclick="setMode('staff')">Staff sign-in</button>
      <button id="m-owner" class="mini ghost" onclick="setMode('owner')">Owner (key)</button>
    </div>
    <div id="staff-form">
      <div class="field"><label>Work email</label><input id="s-email" type="email" placeholder="you@sambandh.in"/></div>
      <div class="field"><label>Password</label><input id="s-pass" type="password"/></div>
      <div id="totp-row" class="field" style="display:none"><label>2FA code</label><input id="s-totp" inputmode="numeric" placeholder="6-digit code"/></div>
      <button onclick="staffLogin()">Sign in</button>
    </div>
    <div id="owner-form" style="display:none">
      <div class="field"><label>Super admin key</label><input id="o-key" type="password"/></div>
      <button onclick="ownerLogin()">Connect</button>
      <p class="hint" style="margin-top:8px">For bootstrapping before staff accounts exist. Day-to-day, employees should use their own sign-in.</p>
    </div>
    <div id="who" class="hint" style="margin-top:10px"></div>
  </div>

  <!-- Console -->
  <div id="console" style="display:none">
    <div class="between" style="margin-bottom:8px"><div id="who2" class="hint"></div><button class="mini ghost" onclick="logout()">Sign out</button></div>
    <div id="view"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const PARTNER_TYPES = ['individual','firm','organization','institution'];
const REG_KINDS = ['gst','cin','pan','udyam','license','none'];
const DOC_TYPES = ['registration_certificate','gst_certificate','pan_card','id_proof','address_proof','license','other'];
const CATEGORIES = ['venue','photographer','makeup','wedding_planner','jewellery','clothing','hotel','travel','gift','florist','caterer','decor','invitations','restaurant','coach','counselor','astrologer','lawyer','financial_advisor','fitness','nutritionist','home','furniture','other'];
const TIERS = ['standard','gold','platinum','enterprise'];
const CONSULT = new Set(['astrologer','coach','counselor','lawyer','financial_advisor','fitness','nutritionist']);
const KIND_OPTS = ['product','service','booking'];

let AUTH = null;   // { mode:'staff', token } | { mode:'owner', key }
let MODE = 'staff';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = s => String(s||'').replace(/_/g,' ');
const opt = (arr, sel) => arr.map(v=>`<option value="${v}" ${v===sel?'selected':''}>${label(v)}</option>`).join('');
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none', 3400); }
function setMode(m){ MODE=m; $('#staff-form').style.display=m==='staff'?'block':'none'; $('#owner-form').style.display=m==='owner'?'block':'none'; $('#m-staff').className='mini'+(m==='staff'?'':' ghost'); $('#m-owner').className='mini'+(m==='owner'?'':' ghost'); }

function authHeaders(json){ const h = json?{'Content-Type':'application/json'}:{}; if(AUTH&&AUTH.mode==='staff') h['x-staff-token']=AUTH.token; else if(AUTH&&AUTH.mode==='owner') h['x-super-key']=AUTH.key; return h; }
async function req(method, path, body){
  const r = await fetch('/api'+path, { method, headers: authHeaders(!!body), body: body?JSON.stringify(body):undefined });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
const get = p => req('GET', p);
const post = (p,b) => req('POST', p, b);
const patch = (p,b) => req('PATCH', p, b);

async function staffLogin(){
  const email=$('#s-email').value.trim(), password=$('#s-pass').value, totp=$('#s-totp').value.trim();
  if(!email||!password) return toast('Enter email and password');
  try {
    const r = await fetch('/api/developer/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,totp:totp||undefined})});
    const j = await r.json().catch(()=>({}));
    if (j.twoFactorRequired) { $('#totp-row').style.display='flex'; return toast('Enter your 2FA code to continue'); }
    if (!r.ok || !j.token) return toast(j.error || 'Sign-in failed');
    AUTH = { mode:'staff', token:j.token };
    enterConsole((j.staff&&(j.staff.email||j.staff.name))||email, j.staff&&j.staff.roleLabel);
  } catch(e){ toast(e.message); }
}
async function ownerLogin(){
  const key=$('#o-key').value.trim(); if(!key) return toast('Enter the super admin key');
  AUTH = { mode:'owner', key };
  try { await get('/marketplace/partners'); enterConsole('Owner', 'super admin'); }
  catch(e){ AUTH=null; toast(e.message); }
}
function logout(){ AUTH=null; $('#console').style.display='none'; $('#signin').style.display='block'; }

async function enterConsole(who, role){
  try { await get('/marketplace/partners'); }
  catch(e){ return toast(e.message.match(/permission|scope/i) ? 'Your account lacks the market:manage permission — ask an admin to grant it.' : e.message); }
  $('#signin').style.display='none'; $('#console').style.display='block';
  $('#who2').innerHTML = 'Signed in as <b>'+esc(who)+'</b>'+(role?(' · '+esc(role)):'');
  renderList();
}

// ---------- Partner list ----------
async function renderList(){
  const v=$('#view');
  v.innerHTML = `<div class="between"><h2 style="margin-top:0">Partners</h2><div class="row">
      <select id="f-cat" onchange="renderList()" style="width:auto"><option value="">All categories</option>${opt(CATEGORIES)}</select>
      <select id="f-status" onchange="renderList()" style="width:auto"><option value="">Any status</option>${['unverified','pending','verified','rejected'].map(s=>`<option>${s}</option>`).join('')}</select>
      <button class="mini" onclick="showAdd()">+ Add partner</button></div></div>
    <div id="plist"><div class="hint">Loading…</div></div>`;
  const cat=$('#f-cat')?$('#f-cat').value:'', st=$('#f-status')?$('#f-status').value:'';
  try {
    const r = await get('/marketplace/partners'+(cat||st?('?'+[cat?'category='+cat:'',st?'status='+st:''].filter(Boolean).join('&')):''));
    const el=$('#plist');
    if(!r.partners.length){ el.innerHTML='<div class="hint">No partners yet — add your first.</div>'; return; }
    el.innerHTML = r.partners.map(p=>`<div class="card"><div class="between">
      <div><b style="font-size:15px;cursor:pointer" onclick="openDetail('${p.id}')">${esc(p.name)}</b> ${statusPill(p)}
        <div class="hint">${esc(label(p.type))} · ${esc(label(p.category))}${p.city?' · '+esc(p.city):''}${p.legalName?' · '+esc(p.legalName):''}</div></div>
      <button class="mini ghost" onclick="openDetail('${p.id}')">Manage →</button></div></div>`).join('');
  } catch(e){ $('#plist').innerHTML=`<div class="hint">${esc(e.message)}</div>`; }
}
function statusPill(p){
  if(p.suspended) return '<span class="pill r">suspended</span>';
  const s=(p.verification&&p.verification.status)||'unverified';
  if(p.verified||s==='verified') return '<span class="pill g">verified</span>';
  if(s==='pending') return '<span class="pill h">pending review</span>';
  if(s==='rejected') return '<span class="pill r">rejected</span>';
  return '<span class="pill h">unverified</span>';
}

// ---------- Add partner ----------
function showAdd(){
  const v=$('#view');
  v.innerHTML = `<a onclick="renderList()">← Partners</a><h2>Add a partner</h2>
  <div class="card"><div class="grid2">
    <div class="field"><label>Display name *</label><input id="a-name" placeholder="Grand Palace Banquets"/></div>
    <div class="field"><label>Entity type</label><select id="a-type">${opt(PARTNER_TYPES,'individual')}</select></div>
    <div class="field"><label>Category *</label><select id="a-cat">${opt(CATEGORIES)}</select></div>
    <div class="field"><label>Legal name</label><input id="a-legal" placeholder="Registered legal name"/></div>
    <div class="field"><label>Registration type</label><select id="a-regk">${opt(REG_KINDS,'none')}</select></div>
    <div class="field"><label>Registration number</label><input id="a-regn" placeholder="GSTIN / CIN / PAN / Udyam"/></div>
    <div class="field"><label>Contact person</label><input id="a-cpn" placeholder="Full name"/></div>
    <div class="field"><label>Contact email</label><input id="a-cpe" type="email" placeholder="contact@business.com"/></div>
    <div class="field"><label>Contact phone</label><input id="a-cpp" placeholder="+91…"/></div>
    <div class="field"><label>City</label><input id="a-city" placeholder="Mumbai"/></div>
    <div class="field"><label>Website</label><input id="a-web" placeholder="https://…"/></div>
    <div class="field"><label>Partner tier</label><select id="a-tier">${opt(TIERS,'standard')}</select></div>
  </div>
  <div class="field"><label>Address</label><textarea id="a-addr" rows="2"></textarea></div>
  <button onclick="createPartner()">Create partner</button>
  <p class="hint" style="margin-top:8px">New partners start <b>unverified</b>. Upload their documents and verify them from the partner's page.</p></div>`;
}
async function createPartner(){
  const name=$('#a-name').value.trim(); if(name.length<2) return toast('Enter a display name');
  const body = { name, type:$('#a-type').value, category:$('#a-cat').value };
  const g=(id)=>{const el=$(id);return el&&el.value.trim();};
  if(g('#a-legal')) body.legalName=g('#a-legal');
  if(g('#a-regn')) body.registration={ kind:$('#a-regk').value, number:g('#a-regn') };
  const cp={}; if(g('#a-cpn'))cp.name=g('#a-cpn'); if(g('#a-cpe'))cp.email=g('#a-cpe'); if(g('#a-cpp'))cp.phone=g('#a-cpp'); if(Object.keys(cp).length) body.contactPerson=cp;
  if(g('#a-city')) body.city=g('#a-city'); if(g('#a-web')) body.website=g('#a-web'); if(g('#a-addr')) body.address=g('#a-addr');
  body.tier=$('#a-tier').value;
  try { const r=await post('/marketplace/partners', body); toast('Partner created ✓'); openDetail(r.partner.id); }
  catch(e){ toast(e.message); }
}

// ---------- Partner detail ----------
async function openDetail(id){
  const v=$('#view'); v.innerHTML='<div class="hint">Loading…</div>';
  let p; try { p=(await get('/marketplace/partners/'+id)).partner; } catch(e){ return v.innerHTML=`<div class="hint">${esc(e.message)}</div>`; }
  const reg=p.registration||{}, cp=p.contactPerson||{}, ver=p.verification||{};
  v.innerHTML = `<a onclick="renderList()">← Partners</a>
  <div class="between"><h2>${esc(p.name)} ${statusPill(p)}</h2></div>
  <div class="card">
    <b>Authentication (KYB)</b>
    <div class="hint" style="margin:4px 0 10px">${ver.status==='verified'?('Verified by '+esc(ver.reviewedBy||'staff')+' on '+fmt(ver.reviewedAt)) : ver.status==='rejected'?('Rejected: '+esc(ver.notes||'')) : ver.status==='pending'?'Documents submitted — awaiting review.' : 'Not yet reviewed.'}</div>
    <div id="docs">${docsHtml(p)}</div>
    <div class="row" style="margin-top:10px">
      <select id="d-type" style="width:auto">${opt(DOC_TYPES)}</select>
      <label class="mini ghost" style="cursor:pointer;padding:7px 12px;border:1px solid var(--line);border-radius:9px">Upload document<input id="d-file" type="file" accept="image/*,application/pdf" style="display:none" onchange="uploadDoc('${p.id}',this)"/></label>
    </div>
    <div class="row" style="margin-top:12px">
      <input id="v-notes" placeholder="Verification notes (optional)" style="flex:1;min-width:180px"/>
      <button class="g mini" onclick="verifyPartner('${p.id}')">✓ Verify</button>
      <button class="danger mini" onclick="rejectPartner('${p.id}')">Reject</button>
    </div>
  </div>

  <div class="card"><b>Details</b><div class="grid2" style="margin-top:8px">
    <div class="field"><label>Display name</label><input id="e-name" value="${esc(p.name)}"/></div>
    <div class="field"><label>Entity type</label><select id="e-type">${opt(PARTNER_TYPES,p.type)}</select></div>
    <div class="field"><label>Category</label><select id="e-cat">${opt(CATEGORIES,p.category)}</select></div>
    <div class="field"><label>Legal name</label><input id="e-legal" value="${esc(p.legalName||'')}"/></div>
    <div class="field"><label>Registration type</label><select id="e-regk">${opt(REG_KINDS,reg.kind||'none')}</select></div>
    <div class="field"><label>Registration number</label><input id="e-regn" value="${esc(reg.number||'')}"/></div>
    <div class="field"><label>Contact name</label><input id="e-cpn" value="${esc(cp.name||'')}"/></div>
    <div class="field"><label>Contact email</label><input id="e-cpe" value="${esc(cp.email||'')}"/></div>
    <div class="field"><label>Contact phone</label><input id="e-cpp" value="${esc(cp.phone||'')}"/></div>
    <div class="field"><label>City</label><input id="e-city" value="${esc(p.city||'')}"/></div>
    <div class="field"><label>Website</label><input id="e-web" value="${esc(p.website||'')}"/></div>
    <div class="field"><label>Tier</label><select id="e-tier">${opt(TIERS,p.tier)}</select></div>
    <div class="field"><label>Commission override (0–0.9, blank = default)</label><input id="e-comm" type="number" step="0.01" min="0" max="0.9" value="${p.commissionRate??''}"/></div>
  </div>
  <div class="field"><label>Address</label><textarea id="e-addr" rows="2">${esc(p.address||'')}</textarea></div>
  <div class="row"><button onclick="saveDetail('${p.id}')">Save changes</button>
    ${p.suspended?`<button class="g ghost mini" onclick="setSuspend('${p.id}',false)">Reactivate</button>`:`<button class="danger mini" onclick="setSuspend('${p.id}',true)">Suspend</button>`}</div></div>

  <div class="card"><b>Listings</b><div id="listings"><div class="hint" style="margin-top:6px">Loading…</div></div>
    <div class="grid3" style="margin-top:10px">
      <div class="field"><label>Title</label><input id="l-title" placeholder="30-min consultation"/></div>
      <div class="field"><label>Price (CHF)</label><input id="l-price" type="number" min="1"/></div>
      <div class="field"><label>Kind</label><select id="l-kind">${opt(KIND_OPTS, CONSULT.has(p.category)?'booking':'service')}</select></div>
    </div>
    <button class="mini" onclick="addListing('${p.id}','${p.category}')">+ Create listing</button></div>`;
  loadListings(p.id, p.category);
}
const fmt = d => d?new Date(d).toLocaleDateString():'';
function docsHtml(p){
  if(!p.documents||!p.documents.length) return '<div class="hint">No documents submitted yet.</div>';
  return p.documents.map(d=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:6px 0">
    <span class="hint">${esc(label(d.type))} · ${d.aavDecision==='reject'?'⚠ failed scan':'scan ok'} · ${fmt(d.uploadedAt)}</span>
    <button class="mini ghost" onclick="viewDoc('${p.id}',${d.index})">View</button></div>`).join('');
}
async function uploadDoc(id, input){
  const f=input.files&&input.files[0]; if(!f) return; if(f.size>12*1024*1024){input.value='';return toast('Max 12 MB');}
  toast('Scanning & uploading…');
  const reader=new FileReader();
  reader.onload=async()=>{ try{ await post('/marketplace/partners/'+id+'/documents',{type:$('#d-type').value,base64:String(reader.result).split(',')[1],filename:f.name}); toast('Document stored ✓'); openDetail(id);}catch(e){toast(e.message);} input.value=''; };
  reader.readAsDataURL(f);
}
async function viewDoc(id, index){
  try{ const r=await fetch('/api/marketplace/partners/'+id+'/documents/'+index+'/content',{headers:authHeaders(false)}); if(!r.ok) throw new Error('Could not open'); const url=URL.createObjectURL(await r.blob()); window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){toast(e.message);}
}
async function verifyPartner(id){ try{ await post('/marketplace/partners/'+id+'/verify',{notes:$('#v-notes').value.trim()}); toast('Partner verified ✓'); openDetail(id);}catch(e){toast(e.message);} }
async function rejectPartner(id){ const reason=prompt('Reason for rejection:'); if(!reason) return; try{ await post('/marketplace/partners/'+id+'/reject',{reason}); toast('Partner rejected'); openDetail(id);}catch(e){toast(e.message);} }
async function setSuspend(id,on){ try{ await patch('/marketplace/partners/'+id,{suspended:on,suspendReason:on?(prompt('Reason (optional):')||''):''}); toast(on?'Suspended':'Reactivated'); openDetail(id);}catch(e){toast(e.message);} }
async function saveDetail(id){
  const g=id2=>{const el=$(id2);return el?el.value.trim():'';};
  const body={ name:g('#e-name'), type:$('#e-type').value, category:$('#e-cat').value, legalName:g('#e-legal'),
    registration:{kind:$('#e-regk').value,number:g('#e-regn')},
    contactPerson:{name:g('#e-cpn'),email:g('#e-cpe'),phone:g('#e-cpp')},
    city:g('#e-city'), website:g('#e-web'), address:g('#e-addr'), tier:$('#e-tier').value };
  const comm=parseFloat($('#e-comm').value); if(!isNaN(comm)) body.commissionRate=comm;
  try{ await patch('/marketplace/partners/'+id, body); toast('Saved ✓'); }catch(e){ toast(e.message); }
}

// ---------- Listings + slots ----------
async function loadListings(id, cat){
  const box=$('#listings'); if(!box) return;
  try{ const r=await get('/marketplace/partners/'+id+'/listings');
    if(!r.listings.length){ box.innerHTML='<div class="hint" style="margin-top:6px">No listings yet.</div>'; return; }
    box.innerHTML=r.listings.map(l=>`<div class="card" style="margin-top:8px;background:var(--card2)"><div class="between">
      <div><b>${esc(l.title)}</b><div class="hint">${esc(l.kind||'')} · CHF ${l.priceCHF}</div></div>
      ${CONSULT.has(cat)?`<button class="mini ghost" onclick="toggleSlot('${l.id}')">+ Slot</button>`:''}</div>
      <div id="sf-${l.id}"></div></div>`).join('');
  }catch(e){ box.innerHTML=`<div class="hint">${esc(e.message)}</div>`; }
}
async function addListing(id, cat){
  const title=$('#l-title').value.trim(), price=parseFloat($('#l-price').value);
  if(title.length<2) return toast('Enter a listing title'); if(!(price>0)) return toast('Enter a positive price');
  try{ await post('/marketplace/partners/'+id+'/listings',{title,priceCHF:price,kind:$('#l-kind').value}); toast('Listing created ✓'); $('#l-title').value='';$('#l-price').value=''; loadListings(id,cat);}catch(e){toast(e.message);}
}
function toggleSlot(listingId){
  const box=document.getElementById('sf-'+listingId); if(box.innerHTML){box.innerHTML='';return;}
  box.innerHTML=`<div class="row" style="margin-top:8px"><input id="sw-${listingId}" type="datetime-local" style="width:auto"/><input id="sd-${listingId}" type="number" value="30" min="10" max="600" step="5" style="width:80px"/><span class="hint">min</span><button class="mini" onclick="pubSlot('${listingId}')">Publish</button></div>`;
}
async function pubSlot(listingId){
  const when=document.getElementById('sw-'+listingId).value; if(!when) return toast('Pick a date & time');
  const dur=parseInt(document.getElementById('sd-'+listingId).value,10)||30;
  try{ await post('/consultation/listings/'+listingId+'/slots',{startsAt:new Date(when).toISOString(),durationMin:dur}); toast('Slot published ✓'); document.getElementById('sw-'+listingId).value=''; }catch(e){toast(e.message);}
}
setMode('staff');
</script>
</body>
</html>
