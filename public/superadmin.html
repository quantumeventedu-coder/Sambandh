<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sambandh — Super Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='38' cy='50' r='26' fill='none' stroke='%23F3C14B' stroke-width='9'/><circle cx='62' cy='50' r='26' fill='none' stroke='%23D4537E' stroke-width='9'/></svg>"/>
<style>
  :root { --bg:#14060d; --panel:#1f0d16; --line:#3a2230; --ink:#f0e6ea; --mut:#9d8391;
          --pink:#D4537E; --gold:#F3C14B; --green:#3fbf72; --red:#e05c5c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 20px 60px; }
  h1 { font-family:Georgia,serif; font-size:22px; } h1 .sup { color:var(--gold); }
  .sub { color:var(--mut); font-size:12px; margin-bottom:16px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  input, textarea, select { background:var(--panel); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:9px 12px; font-size:13.5px; outline:none; }
  input:focus, textarea:focus { border-color:var(--pink); }
  button { background:var(--pink); border:0; color:#fff; font-weight:700; border-radius:8px;
    padding:9px 16px; cursor:pointer; font-size:13.5px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--mut); }
  button.gold { background:var(--gold); color:#3a2400; }
  button.red { background:var(--red); }
  .tabs { display:flex; gap:6px; margin:14px 0 18px; }
  .tabs button { background:transparent; border:1px solid var(--line); color:var(--mut); }
  .tabs button.on { background:var(--pink); border-color:var(--pink); color:#fff; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat b { display:block; font-size:26px; font-family:Georgia,serif; color:var(--gold); }
  .stat span { font-size:11.5px; color:var(--mut); letter-spacing:.4px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  tr.click { cursor:pointer; } tr.click:hover td { background:rgba(212,83,126,.07); }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:11px; font-weight:700; }
  .pill.g { background:rgba(63,191,114,.15); color:var(--green); }
  .pill.y { background:rgba(243,193,75,.15); color:var(--gold); }
  .pill.r { background:rgba(224,92,92,.15); color:var(--red); }
  .pill.p { background:rgba(212,83,126,.18); color:var(--pink); }
  .msg { max-width:74%; padding:8px 12px; border-radius:12px; margin-bottom:8px; background:#2a1520; border:1px solid var(--line); }
  .msg.b { margin-left:auto; background:#33101f; border-color:#4b2033; }
  .msg .who { font-size:10.5px; color:var(--gold); font-weight:700; margin-bottom:2px; }
  .msg .when { font-size:10px; color:var(--mut); margin-top:3px; }
  .notice { border-left:3px solid var(--gold); background:rgba(243,193,75,.07); padding:10px 14px; border-radius:8px;
            font-size:12.5px; color:#e8d9b0; margin-bottom:14px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media(max-width:860px){ .grid2{grid-template-columns:1fr} }
  a.back { color:var(--pink); cursor:pointer; font-size:12.5px; text-decoration:none; display:inline-block; margin-bottom:10px; }
  pre { white-space:pre-wrap; font-size:12px; color:var(--mut); }
  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--gold); color:#3a2400;
           padding:10px 20px; border-radius:99px; font-weight:700; display:none; z-index:99; }
</style>
</head>
<body>
<div class="wrap">
  <h1>sambandh <span class="sup">/ super admin</span></h1>
  <div class="sub">Owner-only console. Every content access is permanently audit-logged — including yours.</div>

  <div class="bar">
    <input aria-label="Super admin key" id="key" type="password" placeholder="Super admin key" style="flex:1;max-width:340px"/>
    <button onclick="connect()">Connect</button>
    <span id="conn" class="pill r">disconnected</span>
  </div>

  <div id="panel" style="display:none">
    <div class="tabs">
      <button id="tb-overview" class="on" onclick="show('overview')">Overview</button>
      <button id="tb-users" onclick="show('users')">Users &amp; Chats</button>
      <button id="tb-llm" onclick="show('llm')">AI Engine</button>
      <button id="tb-audit" onclick="show('audit')">Audit trail</button>
      <button id="tb-test" onclick="show('test')">System Test</button>
      <button id="tb-commerce" onclick="show('commerce')">Commerce &amp; Tax</button>
      <button id="tb-coupons" onclick="show('coupons')">Coupons</button>
      <button id="tb-locations" onclick="show('locations')">Locations</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<div id="toast"></div>

<script>
let KEY = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none', 3200); }

async function api(path) {
  const r = await fetch('/api/superadmin' + path, { headers: { 'X-Super-Key': KEY } });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function apiPost(path, body) {
  const r = await fetch('/api/superadmin' + path, { method:'POST',
    headers: { 'X-Super-Key': KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function apiPut(path, body) {
  const r = await fetch('/api/superadmin' + path, { method:'PUT',
    headers: { 'X-Super-Key': KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function apiPatch(path, body) {
  const r = await fetch('/api/superadmin' + path, { method:'PATCH',
    headers: { 'X-Super-Key': KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

async function connect() {
  KEY = $('#key').value.trim();
  try {
    await api('/stats');
    // Remember it only after the server accepted it, and only on this machine.
    try { sessionStorage.setItem('sb_super_key', KEY); } catch { /* private mode */ }
    $('#conn').textContent = 'connected · full access'; $('#conn').className = 'pill g';
    $('#panel').style.display = 'block';
    show('overview');
  } catch (e) {
    try { sessionStorage.removeItem('sb_super_key'); } catch { /* ignore */ }
    $('#conn').textContent = 'rejected'; $('#conn').className = 'pill r';
    toast(e.message);
  }
}

function show(tab) {
  ['overview','users','llm','audit','test','commerce','coupons','locations'].forEach(t => $('#tb-'+t).classList.toggle('on', t===tab));
  if (tab==='overview') renderOverview();
  if (tab==='users') renderUsers();
  if (tab==='llm') renderLLM();
  if (tab==='audit') renderAudit();
  if (tab==='test') renderTest();
  if (tab==='commerce') renderCommerce();
  if (tab==='coupons') renderCoupons();
  if (tab==='locations') renderLocations();
}

// ---- Commerce & Tax editor: prices, per-country taxes, gateway fee, cancellation ----
let COMMERCE = null;
function catRow(code, k, v) {
  return `<div class="crow" style="display:flex;gap:6px;align-items:center;margin:4px 0">
    <input class="cat-k" value="${esc(k)}" placeholder="category" style="width:170px"/>
    <input class="cat-v" type="number" step="0.1" min="0" max="100" value="${esc(v)}" style="width:80px"/><span style="color:#888">%</span></div>`;
}
function countryCard(code, cfg) {
  const cats = Object.entries(cfg.categories || {}).map(([k, v]) => catRow(code, k, v)).join('');
  return `<div class="card" data-country="${esc(code)}" style="margin-top:10px">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <b style="font-size:15px">${esc(code)}</b>
      <label>Currency <input class="c-cur" value="${esc(cfg.currency || '')}" style="width:64px"/></label>
      <label>Tax label <input class="c-tax" value="${esc(cfg.taxName || '')}" style="width:100px"/></label>
    </div>
    <div class="cats" style="margin-top:8px">${cats}</div>
    <button onclick="addCat(this)" style="margin-top:4px">+ category</button>
  </div>`;
}
async function renderCommerce() {
  try { COMMERCE = await api('/commerce'); }
  catch (e) { $('#view').innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
  let BIZ = {}; try { BIZ = (await api('/business')).business || {}; } catch { BIZ = {}; }
  const al = BIZ.addressLines || [];
  const c = COMMERCE;
  const countries = Object.entries(c.countries || {}).map(([code, cfg]) => countryCard(code, cfg)).join('');
  $('#view').innerHTML = `
    <div class="card">
      <h3 style="font-family:Georgia,serif;margin-bottom:2px">Business details — appear on every invoice / receipt</h3>
      <p style="color:#888;font-size:13px">Your legal entity, GSTIN and address. Shown on the tax invoice buyers download from Payment history.</p>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px">
        <label>Legal name<input id="bz-legal" value="${esc(BIZ.legalName || '')}"/></label>
        <label>Trade name<input id="bz-trade" value="${esc(BIZ.tradeName || 'Sambandh')}"/></label>
        <label>GSTIN<input id="bz-gstin" value="${esc(BIZ.gstin || '')}"/></label>
        <label>PAN<input id="bz-pan" value="${esc(BIZ.pan || '')}"/></label>
        <label style="grid-column:1/3">Address line 1<input id="bz-addr1" value="${esc(al[0] || '')}"/></label>
        <label style="grid-column:1/3">Address line 2<input id="bz-addr2" value="${esc(al[1] || '')}"/></label>
        <label>City<input id="bz-city" value="${esc(BIZ.city || '')}"/></label>
        <label>State<input id="bz-state" value="${esc(BIZ.state || '')}"/></label>
        <label>State code (GST)<input id="bz-statecode" value="${esc(BIZ.stateCode || '')}"/></label>
        <label>Postal code<input id="bz-postal" value="${esc(BIZ.postalCode || '')}"/></label>
        <label>Country<input id="bz-country" value="${esc(BIZ.country || 'IN')}"/></label>
        <label>Invoice prefix<input id="bz-prefix" value="${esc(BIZ.invoicePrefix || 'SB')}"/></label>
        <label>Default SAC code<input id="bz-sac" value="${esc(BIZ.sacCode || '')}" placeholder="e.g. 998439"/></label>
        <label>Email<input id="bz-email" value="${esc(BIZ.email || '')}"/></label>
        <label>Phone<input id="bz-phone" value="${esc(BIZ.phone || '')}"/></label>
      </div>
      <button onclick="saveBusiness()" style="margin-top:10px">Save business details</button>
    </div>
    <div class="card">
      <h3 style="font-family:Georgia,serif;margin-bottom:2px">Commerce &amp; Tax — editable per jurisdiction</h3>
      <p style="color:#888;font-size:13px">Tax varies by government and changes over time — verify each rate against the current law for that jurisdiction. Edits apply to new checkouts immediately.</p>
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:10px">
        <label>Gateway fee % <input id="gw-fee" type="number" step="0.1" min="0" max="100" value="${esc(c.gatewayFeePct)}" style="width:80px"/></label>
        <label>Cancellation window (days) <input id="cx-days" type="number" min="0" max="365" value="${esc(c.cancellation && c.cancellation.windowDays)}" style="width:70px"/></label>
        <label><input id="cx-prorate" type="checkbox" ${c.cancellation && c.cancellation.prorate ? 'checked' : ''}/> Pro-rate refund</label>
      </div>
    </div>
    ${countryCard('DEFAULT', c.DEFAULT)}
    ${countries}
    <div style="margin-top:12px;display:flex;gap:8px">
      <button onclick="saveCommerce()">Save all</button>
      <button onclick="addCountry()">+ country</button>
    </div>`;
}
function addCat(btn) {
  const box = btn.parentElement.querySelector('.cats');
  box.insertAdjacentHTML('beforeend', catRow('', '', ''));
}
function addCountry() {
  const code = (prompt('Country code (2-letter ISO, e.g. BR):') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2);
  if (code.length !== 2) return;
  const cards = document.querySelectorAll('[data-country]');
  const last = cards[cards.length - 1];
  last.insertAdjacentHTML('afterend', countryCard(code, { currency: 'USD', taxName: 'Tax', categories: { default: 0 } }));
}
async function saveBusiness() {
  const b = {
    legalName: $('#bz-legal').value, tradeName: $('#bz-trade').value, gstin: $('#bz-gstin').value, pan: $('#bz-pan').value,
    addressLines: [$('#bz-addr1').value, $('#bz-addr2').value].filter(x => x.trim()),
    city: $('#bz-city').value, state: $('#bz-state').value, stateCode: $('#bz-statecode').value,
    postalCode: $('#bz-postal').value, country: $('#bz-country').value, invoicePrefix: $('#bz-prefix').value,
    sacCode: $('#bz-sac').value, email: $('#bz-email').value, phone: $('#bz-phone').value,
  };
  try { await apiPut('/business', b); toast('Business details saved ✓'); }
  catch (e) { toast(e.message); }
}
async function saveCommerce() {
  const gatewayFeePct = parseFloat($('#gw-fee').value);
  const cancellation = { windowDays: parseInt($('#cx-days').value, 10), prorate: $('#cx-prorate').checked };
  const countries = {}; let DEFAULT = null;
  document.querySelectorAll('[data-country]').forEach(card => {
    const code = card.getAttribute('data-country');
    const cfg = { currency: card.querySelector('.c-cur').value.trim(), taxName: card.querySelector('.c-tax').value.trim(), categories: {} };
    card.querySelectorAll('.cats .crow').forEach(row => {
      const k = row.querySelector('.cat-k').value.trim();
      const v = parseFloat(row.querySelector('.cat-v').value);
      if (k && Number.isFinite(v)) cfg.categories[k] = v;
    });
    if (code === 'DEFAULT') DEFAULT = cfg; else countries[code] = cfg;
  });
  try { COMMERCE = await apiPut('/commerce', { gatewayFeePct, cancellation, countries, DEFAULT }); toast('Saved ✓'); renderCommerce(); }
  catch (e) { toast(e.message); }
}

async function renderTest() {
  $('#view').innerHTML = `<div class="card">
    <h3 style="font-family:Georgia,serif;margin-bottom:4px">System Test — every subsystem, unrestricted</h3>
    <div class="sub">Runs each engine and integration live and reports pass/fail. This is your rehearsal console — it shows exactly where the app is solid and where quality is low (unconfigured integrations, fallbacks).</div>
    <div class="bar" style="margin:12px 0"><button class="gold" onclick="runTest()">Run full self-test</button><span id="test-summary" class="sub"></span></div>
    <div id="test-results"></div></div>`;
}
async function runTest() {
  const box = $('#test-results'); const sum = $('#test-summary');
  box.innerHTML = '<div class="sub">Running…</div>'; sum.textContent = '';
  try {
    const r = await api('/selftest');
    sum.innerHTML = ` <span class="pill ${r.summary.allGreen?'g':'y'}">${r.summary.passed}/${r.summary.total} passed</span>`;
    const groups = {};
    r.checks.forEach(c => { (groups[c.group] = groups[c.group] || []).push(c); });
    box.innerHTML = Object.entries(groups).map(([g, cs]) => `<div style="margin-top:12px"><b style="font-size:13px;color:var(--mut)">${esc(g)}</b>
      <table style="margin-top:6px"><tr><th>Feature</th><th>Status</th><th>Detail</th></tr>
      ${cs.map(c => `<tr><td>${esc(c.name)}</td><td><span class="pill ${c.ok?'g':'r'}">${c.ok?'PASS':'FAIL'}</span></td><td class="sub">${esc(c.detail)}</td></tr>`).join('')}
      </table></div>`).join('');
  } catch (e) { box.innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
}

async function renderOverview() {
  const [s, pl] = await Promise.all([api('/stats'), api('/prelaunch')]);
  const launched = !pl.prelaunch;
  $('#view').innerHTML = `
    <div class="card" style="margin-bottom:14px;border:1px solid ${launched ? '#2e7d46' : '#b8860b'}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div>
          <b style="font-size:15px">${launched ? '🟢 LAUNCHED — open to everyone' : '🔒 Pre-launch (early access)'}</b>
          <div style="color:var(--mut);font-size:13px;margin-top:4px">${launched ? 'All verified members can use Discover, Chats & matching.' : 'People can register + pay + build a profile, but Discover/Chats/matching are gated (waiting room). Admins bypass.'}</div>
          <div style="color:var(--mut);font-size:12px;margin-top:6px">Registered <b>${pl.registered}</b> · Paid <b>${pl.paid}</b> · Photo-verified <b>${pl.verified}</b> · Email waitlist <b>${pl.emailWaitlist}</b></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button onclick="togglePrelaunch(${!launched})" style="background:${launched ? 'transparent' : 'var(--pink)'};border:1px solid var(--pink);white-space:nowrap">
            ${launched ? 'Return to pre-launch' : 'Open the doors — LAUNCH'}
          </button>
          <button onclick="purgeTestData()" class="ghost" style="white-space:nowrap;font-size:12px">Purge demo/test accounts</button>
          <button onclick="resetCleanSlate()" class="ghost" style="white-space:nowrap;font-size:12px;border-color:var(--pink);color:var(--pink)">Reset to clean slate</button>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>${s.users.total}</b><span>USERS</span></div>
      <div class="stat"><b>${s.users.verified}</b><span>ID VERIFIED</span></div>
      <div class="stat"><b>${s.users.paid}</b><span>JOIN FEE PAID</span></div>
      <div class="stat"><b>${s.users.base ?? 0} / ${s.users.pro} / ${s.users.max}</b><span>BASE / PRO / MAX</span></div>
      <div class="stat"><b>${s.users.suspended} / ${s.users.banned}</b><span>SUSPENDED / BANNED</span></div>
      <div class="stat"><b>${s.chats.total}</b><span>CHATS</span></div>
      <div class="stat"><b>${s.chats.messages24h}</b><span>MESSAGES · 24H</span></div>
      <div class="stat"><b>${s.moderation.reportsPending}</b><span>REPORTS PENDING</span></div>
      <div class="stat"><b>${s.moderation.reportsEscalated}</b><span>AUTO-ESCALATED</span></div>
      <div class="stat"><b>CHF ${s.revenue.totalCHF}</b><span>REVENUE (${s.revenue.capturedPayments} PAYMENTS)</span></div>
    </div>
    <div class="card" style="margin-top:14px">
      <b style="color:var(--gold)">Experience the product as…</b>
      <div class="notice" style="margin:6px 0 10px">Opens a preview seat in a new tab. Preview accounts are excluded from every count and removed by Reset to clean slate.</div>
      <div class="bar">
        <button class="ghost" onclick="experienceAs('user')">User · the app</button>
        <button class="ghost" onclick="experienceAs('admin')">Admin</button>
        <button class="ghost" onclick="experienceAs('moderator')">Moderator</button>
        <button class="ghost" onclick="experienceAs('developer')">Developer</button>
        <button class="ghost" onclick="experienceAs('support')">Customer Support</button>
      </div>
    </div>
    <div class="notice" style="margin-top:14px">Chat content access lives under <b>Users &amp; Chats</b> and always
      requires a written reason. Admins/moderators cannot see message content at all — only you can, and it's logged.</div>`;
}

async function experienceAs(as) {
  try {
    const r = await apiPost('/impersonate', { as });
    window.open(r.url + '?imp=' + encodeURIComponent(r.token), '_blank');
  } catch (e) { alert('Could not start preview: ' + e.message); }
}

async function purgeTestData() {
  if (!confirm('Delete ALL demo/test accounts (no real email, not admin) and their data? Real & admin accounts are kept. This cannot be undone.')) return;
  try {
    const r = await apiPost('/purge-test-data', { confirm: true });
    alert(r.message || ('Deleted ' + r.deleted + ', kept ' + r.kept));
    renderOverview();
  } catch (e) { alert('Purge failed: ' + e.message); }
}

async function resetCleanSlate() {
  const ok = prompt('FULL RESET — permanently deletes ALL accounts (except admin/staff), payments, chats, training data, waitlist. Real zero.\n\nType  WIPE ALL  to confirm:');
  if (ok !== 'WIPE ALL') { if (ok !== null) alert('Not confirmed — nothing was deleted.'); return; }
  try {
    const r = await apiPost('/reset-clean-slate', { confirm: 'WIPE ALL' });
    alert(r.message || ('Wiped. Kept ' + r.keptUsers + ' admin/staff account(s).'));
    renderOverview();
  } catch (e) { alert('Reset failed: ' + e.message); }
}

async function togglePrelaunch(launching) {
  const msg = launching
    ? 'LAUNCH now? Discover, Chats and matching will open to EVERY verified member. Continue?'
    : 'Return to pre-launch? Dating features will be gated (waiting room) for all non-admins.';
  if (!confirm(msg)) return;
  await apiPut('/prelaunch', { prelaunch: !launching });   // launching → prelaunch:false
  renderOverview();
}

async function renderUsers() {
  $('#view').innerHTML = `
    <div class="bar">
      <input id="q" placeholder="Search phone / name / user id…" style="flex:1;max-width:420px"
             onkeydown="if(event.key==='Enter')searchUsers()"/>
      <button onclick="searchUsers()">Search</button>
      <button class="ghost" onclick="searchUsers('')">Latest 25</button>
    </div>
    <div id="results"></div><div id="detail"></div>`;
  searchUsers('');
}

async function searchUsers(force) {
  const q = force !== undefined ? force : $('#q').value.trim();
  const { users } = await api('/users?q=' + encodeURIComponent(q));
  $('#detail').innerHTML = '';
  $('#results').innerHTML = `<div class="card"><table>
    <tr><th>User</th><th>Phone</th><th>Tier</th><th>Lakshan</th><th>Status</th><th>Last active</th></tr>
    ${users.map(u => `<tr class="click" onclick="openUser('${u.id}')">

async function act(id, action) {
  const reason = prompt(`Reason for "${action}" (recorded in the audit log):`);
  if (!reason) return;
  try { await apiPost('/users/' + id + '/action', { action, reason }); toast('Done: ' + action); openUser(id); }
  catch (e) { toast(e.message); }
}
function devLabel(d) {
  if (!d || !d.type) return '';
  const t = String(d.type);
  const icon = /iPhone|iPad/.test(t) ? '📱' : /Android/.test(t) ? '🤖' : /Windows|Mac|Linux|Chromebook/.test(t) ? '💻' : '🖥️';
  return icon + ' ' + esc(t) + (d.native ? ' app' : (d.browser && d.browser !== 'Other' ? ' · ' + esc(d.browser) : ''));
}
function openUserFromMap(id) { show('users'); setTimeout(() => openUser(id), 60); }
async function delUser(id) {
  if (!confirm('PERMANENTLY DELETE this user and all their data (chats, verifications, documents, payments records)? This cannot be undone.')) return;
  const reason = prompt('Reason for deletion (recorded in the audit log):');
  if (!reason || reason.trim().length < 5) return toast('A reason (5+ chars) is required.');
  try { await apiPost('/users/' + id + '/action', { action: 'delete', reason }); toast('User permanently deleted'); renderUsers(); }
  catch (e) { toast(e.message); }
}

async function openChat(chatId) {
  const reason = prompt('Written reason for viewing this conversation (min 10 chars — this is permanently audit-logged):');
  if (!reason) return;
  try {
    const d = await api('/chats/' + chatId + '/messages?reason=' + encodeURIComponent(reason));
    const a = d.chat.participants[0]?.userId;
    $('#detail').innerHTML = `
      <a class="back" onclick="renderUsers()">← back</a>
      <div class="card">
        <h3 style="margin-bottom:4px">${d.chat.participants.map(p=>esc(p.name)).join(' ⇄ ')}</h3>
        <div class="sub">${d.messages.length} messages · ${d.chat.anonymous?'anonymous chat · ':''}intent: ${esc(d.chat.intent||'—')}</div>
        <div class="notice">Access recorded. Reason on file: “${esc(reason)}”</div>
        ${d.messages.map(m => `<div class="msg ${String(m.fromId)===String(a)?'':'b'}">
          <div class="who">${esc(m.from)}</div>${esc(m.text)}
          <div class="when">${new Date(m.createdAt).toLocaleString()}${m.readAt?' · read':''}</div></div>`).join('')}
      </div>`;
  } catch (e) { toast(e.message); }
}

async function explainNeural() {
  const box = $('#neural-explain'); box.innerHTML = '<span class="sub">computing permutation importance…</span>';
  try {
    const r = await api('/ai/explain');
    if (!r.available) { box.innerHTML = `<span class="pill y">${esc(r.reason||'unavailable')}</span>`; return; }
    const max = Math.max(...r.importance.map(x=>x.importance), 0.0001);
    box.innerHTML = `<div class="sub">Permutation importance — how much accuracy drops when each feature is scrambled
      (baseline ${Math.round(r.baseAccuracy*100)}% on ${num(r.examples)} examples). This probes the trained network's
      actual behaviour, not its raw weights.</div>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:5px">
        ${r.importance.map(x=>`<div style="display:flex;align-items:center;gap:8px">
          <span style="width:120px;font-size:12px;color:var(--mut)">${esc(x.feature)}</span>
          <span style="flex:1;background:rgba(120,120,120,.15);border-radius:4px;height:14px;position:relative">
            <span style="position:absolute;left:0;top:0;bottom:0;width:${Math.round(x.importance/max*100)}%;background:var(--gold,#c8a24a);border-radius:4px"></span>
          </span>
          <span style="width:52px;text-align:right;font-size:12px">${(x.importance*100).toFixed(1)}%</span>
        </div>`).join('')}
      </div>`;
  } catch (e) { box.innerHTML = `<span class="pill r">${esc(e.message)}</span>`; }
}

    const r = await apiPost('/ai-keys', { name, rateLimitPerMin });
    $('#ak-new').innerHTML = `<div class="notice" style="margin-top:8px">New key for <b>${esc(r.name)}</b> — copy it now, it won't be shown again:

async function revokeAiKey(id) {

  } catch (e) { toast(e.message); }

// ---- Location oversight map (NASA GIBS satellite basemap + precise pins) ----------------
// ---- Interactive maps (Leaflet: real zoom / pan / satellite·NASA·streets layers / popups) ----
const LOC = { points: [], flt: {}, map: null, markers: null, trail: null };
let _leaflet = null;
function ensureLeaflet() {
  if (window.L) return Promise.resolve();
  if (_leaflet) return _leaflet;
  _leaflet = new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload = () => resolve();
    s.onerror = () => { _leaflet = null; reject(new Error('Could not load the map library (offline?).')); };
    document.head.appendChild(s);
  });
  return _leaflet;
}
// Three real basemaps. Esri World Imagery = high-res satellite that zooms to buildings (default);
// NASA GIBS Blue Marble = the NASA satellite look (coarse, ~500 m); OSM = streets with labels.
function baseLayers() {
  const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, attribution: 'Esri · Maxar · Earthstar' });
  const nasa = L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_NextGeneration/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg', { maxZoom: 20, maxNativeZoom: 8, attribution: 'NASA GIBS · Blue Marble' });
  const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  return { esri, nasa, streets };
}
function relTime(t){ const s=Math.max(1,Math.floor((Date.now()-new Date(t).getTime())/1000)); if(s<60)return s+'s ago'; const m=Math.floor(s/60); if(m<60)return m+'m ago'; const h=Math.floor(m/60); if(h<24)return h+'h ago'; return Math.floor(h/24)+'d ago'; }
function fmtDur(ms){ const m=Math.round((ms||0)/60000); if(m<60)return m+' min'; const h=Math.floor(m/60); return h+'h '+(m%60)+'m'; }
function locFilteredPoints() {
  return LOC.points.filter(p => {
    if (LOC.flt.hidePreview && p.preview) return false;
    if (LOC.flt.verified && !p.verified) return false;
    if (LOC.flt.active && !p.active) return false;
    if (LOC.flt.suspended && !p.suspended) return false;
    return true;
  });
}
async function renderLocations() {
  $('#view').innerHTML = '<div class="card">Loading map…</div>';
  let data;
  try { await ensureLeaflet(); data = await api('/locations'); }
  catch (e) { $('#view').innerHTML = '<div class="card">'+esc(e.message)+'</div>'; return; }
  LOC.points = data.points || [];
  LOC.flt = { verified:false, active:false, suspended:false, hidePreview:false };
  $('#view').innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <h3 style="font-family:Georgia,serif;margin:0">User locations <span style="color:var(--mut);font-weight:400">· <span id="loc-count">${LOC.points.length}</span> shown</span></h3>
        <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px;align-items:center">
          <label><input type="checkbox" onchange="LOC.flt.verified=this.checked;drawMap()"> Verified</label>
          <label><input type="checkbox" onchange="LOC.flt.active=this.checked;drawMap()"> Active now</label>
          <label><input type="checkbox" onchange="LOC.flt.suspended=this.checked;drawMap()"> Suspended</label>
          <label><input type="checkbox" onchange="LOC.flt.hidePreview=this.checked;drawMap()"> Hide preview</label>
          <button onclick="locFit()">Fit</button><button onclick="LOC.map&&LOC.map.flyToBounds([[6,67],[37,98]])">India</button><button onclick="LOC.map&&LOC.map.setView([20,0],2)">World</button>
        </div>
      </div>
      <p style="color:#888;font-size:12px;margin:6px 0 10px">Scroll to <b>zoom</b>, drag to <b>pan</b>, switch <b>Satellite / NASA / Streets</b> top-right, tap a pin for detail. Exact coordinates are <b>admin-only</b>, captured <b>only while a user has the app open</b>. Legend: <span style="color:#46c37b">●</span> verified · <span style="color:#3aa0ff">●</span> active now · <span style="color:#e5484d">●</span> suspended.</p>
      <div id="loc-map" style="width:100%;height:600px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#04070f;z-index:0"></div>
      <div id="loc-empty" style="color:var(--mut);font-size:13px;margin-top:8px"></div>
    </div>`;
  initLocMap();
}
function initLocMap() {
  if (LOC.map) { LOC.map.remove(); LOC.map = null; }
  const { esri, nasa, streets } = baseLayers();
  const map = L.map('loc-map', { worldCopyJump: true, layers: [esri] }).setView([22, 79], 4);
  LOC.map = map;
  L.control.layers({ 'Satellite (Esri)': esri, 'NASA satellite': nasa, 'Streets': streets }, {}, { collapsed: true }).addTo(map);
  LOC.markers = L.layerGroup().addTo(map);
  drawMap(true);
  setTimeout(() => map.invalidateSize(), 80);
}
function drawMap(fit) {
  if (!LOC.map || !window.L) return;
  LOC.markers.clearLayers();
  if (LOC.trail) { LOC.map.removeLayer(LOC.trail); LOC.trail = null; }
  const pts = locFilteredPoints();
  const cnt = document.getElementById('loc-count'); if (cnt) cnt.textContent = pts.length;
  const latlng = [];
  for (const p of pts) {
    const c = p.suspended?'#e5484d':p.active?'#3aa0ff':p.verified?'#46c37b':'#e8b84b';
    const m = L.circleMarker([p.lat, p.lng], { radius: 7, color: '#fff', weight: 1.5, fillColor: c, fillOpacity: .95 });
    m.bindPopup(locPopupHtml(p), { minWidth: 210 });
    m.addTo(LOC.markers);
    latlng.push([p.lat, p.lng]);
  }
  const empty = document.getElementById('loc-empty');
  if (empty) empty.textContent = !LOC.points.length
    ? 'No user has shared a live location yet — pins appear as users open the app with location on.'
    : (!pts.length ? 'Your filters hide every located user — uncheck the filters above.' : '');
  if (fit && latlng.length) LOC.map.fitBounds(latlng, { padding: [40,40], maxZoom: 13 });
}
function locFit() { drawMap(true); }
function locPopupHtml(p) {
  const maps = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  return `<div style="min-width:190px;line-height:1.5">
    <b>${esc(p.name||'User')}</b> ${p.verified?'✓':''}${p.suspended?' 🚫':''}<br>
    <span style="color:#777;font-size:12px">${esc(p.city||'')}${p.active?' · active now':(p.at?' · '+relTime(p.at):'')}</span><br>
    <span style="font-family:monospace;font-size:11px">${Number(p.lat).toFixed(5)}, ${Number(p.lng).toFixed(5)}${p.accuracy?(' · ±'+Math.round(p.accuracy)+' m'):''}</span>
    ${p.device&&p.device.type?`<br><span style="font-size:12px">${devLabel(p.device)} · ${p.device.mobile?'mobile':'desktop'}</span>`:''}
    <div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">
      <button onclick="openUserFromMap('${p.id}')">Full detail</button>
      <button onclick="window.open('${maps}','_blank','noopener')">Device map</button>
      <button onclick="loadTrailOnMap('${p.id}')">7-day trail</button>
    </div></div>`;
}
async function loadTrailOnMap(id) {
  try {
    const r = await api('/users/'+id+'/location-trail?days=7');
    if (LOC.trail) { LOC.map.removeLayer(LOC.trail); LOC.trail = null; }
    const line = (r.trail||[]).map(t => [t.lat, t.lng]);
    if (line.length) {
      const grp = L.featureGroup();
      L.polyline(line, { color: '#ffd23f', weight: 3, opacity: .95 }).addTo(grp);
      L.circleMarker(line[line.length-1], { radius: 5, color: '#ffd23f', weight: 1, fillColor: '#ffd23f', fillOpacity: 1 }).addTo(grp);
      grp.addTo(LOC.map); LOC.trail = grp;
      LOC.map.fitBounds(grp.getBounds(), { padding: [50,50], maxZoom: 16 });
    }
    toast(`Trail: ${r.points} fix(es) over 7 days · been within 150 m for ~${fmtDur(r.dwellMs)}`);
  } catch (e) { toast(e.message); }
}
// ---- Per-user mini map (on the Users & Chats detail) ----
let U_MAP = null;
function userLocCardHtml(u) {
  const loc = u.profile && u.profile.location;
  if (!loc || typeof loc.lat !== 'number' || typeof loc.lng !== 'number') {
    return `<div class="card"><h3 style="margin:0 0 6px">Location</h3><div style="color:var(--mut);font-size:13px">No live location captured yet — it appears here once the user opens the app with location enabled.</div></div>`;
  }
  const maps = `https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}`;
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">Location</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="ghost" onclick="window.open('${maps}','_blank','noopener')">Open in device map</button>
        <button class="ghost" onclick="userTrail('${u._id}')">Show 7-day trail</button>
      </div>
    </div>
    <div style="font-family:monospace;font-size:12px;color:var(--mut);margin:4px 0 8px">${Number(loc.lat).toFixed(5)}, ${Number(loc.lng).toFixed(5)}${loc.accuracy?(' · ±'+Math.round(loc.accuracy)+' m accuracy'):''}${loc.updatedAt?(' · '+new Date(loc.updatedAt).toLocaleString()):''}</div>
    <div id="u-map" style="width:100%;height:340px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#04070f;z-index:0"></div>
    <div id="u-trailinfo" style="color:var(--mut);font-size:12px;margin-top:6px"></div>
  </div>`;
}
function renderUserMiniMap(u) {
  const el = document.getElementById('u-map'); if (!el || !window.L) return;
  if (U_MAP) { U_MAP.remove(); U_MAP = null; }
  const loc = u.profile.location;
  const { esri, nasa, streets } = baseLayers();
  const map = L.map('u-map', { layers: [esri] }).setView([loc.lat, loc.lng], 15);
  U_MAP = map;
  L.control.layers({ 'Satellite': esri, 'NASA': nasa, 'Streets': streets }, {}, { collapsed: true }).addTo(map);
  L.circleMarker([loc.lat, loc.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#3aa0ff', fillOpacity: .95 }).addTo(map);
  if (loc.accuracy) L.circle([loc.lat, loc.lng], { radius: loc.accuracy, color: '#3aa0ff', weight: 1, fillColor: '#3aa0ff', fillOpacity: .12 }).addTo(map);
  setTimeout(() => map.invalidateSize(), 80);
}
async function userTrail(id) {
  const info = document.getElementById('u-trailinfo'); if (info) info.textContent = 'Loading trail…';
  try {
    const r = await api('/users/'+id+'/location-trail?days=7');
    if (U_MAP && window.L) {
      const line = (r.trail||[]).map(t => [t.lat, t.lng]);
      if (line.length) {
        const grp = L.featureGroup();
        L.polyline(line, { color: '#ffd23f', weight: 3, opacity: .95 }).addTo(grp);
        L.circleMarker(line[line.length-1], { radius: 5, color: '#ffd23f', weight: 1, fillColor: '#ffd23f', fillOpacity: 1 }).addTo(grp);
        grp.addTo(U_MAP);
        U_MAP.fitBounds(grp.getBounds(), { padding: [40,40], maxZoom: 16 });
      }
    }
    if (info) info.textContent = `Trail: ${r.points} fix(es) over 7 days · been within 150 m for ~${fmtDur(r.dwellMs)}`;
  } catch (e) { if (info) info.textContent = e.message; }
}
